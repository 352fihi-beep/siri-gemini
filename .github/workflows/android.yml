name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute for gradlew
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9 || true
          fi
          chmod +x ./gradlew 2>/dev/null || true

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            echo "Gradle wrapper missing — open project in Android Studio once to generate it."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: siri-gemini-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build release (unsigned unless secrets set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            ./gradlew :app:assembleRelease --stacktrace \
              -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD || ./gradlew :app:assembleRelease --stacktrace
          else
            ./gradlew :app:assembleRelease --stacktrace || true
            echo "No KEYSTORE secrets — release may be unsigned"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: siri-gemini-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
